name: publish-backend-release

on:
  push:
    paths:
      - backend-release-request.json
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-backend-release
  cancel-in-progress: false

jobs:
  publish:
    if: ${{ !contains(github.event.head_commit.message, '[skip publish]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read release request
        run: |
          python3 - <<'PY'
          import json, os
          r = json.load(open('backend-release-request.json', encoding='utf-8'))
          required = ['version', 'tag', 'pkg_url', 'asset_name', 'sha256', 'size', 'signature', 'notes']
          missing = [k for k in required if k not in r]
          if missing:
              raise SystemExit('missing fields: ' + ', '.join(missing))
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as f:
              for k in required[:7]:
                  f.write(f"{k.upper()}={r[k]}\n")
              f.write('NOTES<<EOF\n' + r['notes'] + '\nEOF\n')
          PY

      - name: Verify signed request and version
        env:
          OWC_MANIFEST_PUBKEY: "302a300506032b6570032100ffef8dfc9e818fe2a0b70c18c2f3b03608707e3d50464f40a355096f142881d5"
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, json, os, re, subprocess
          r = json.load(open('backend-release-request.json', encoding='utf-8'))
          if r['tag'] != r['version']:
              raise SystemExit('tag must equal version')
          if not re.fullmatch(r'H\d+\.\d+\.\d+', r['version']):
              raise SystemExit('invalid backend version: ' + r['version'])
          size = int(r['size'])
          if size <= 0:
              raise SystemExit('size must be positive')
          if not re.fullmatch(r'[0-9a-f]{64}', r['sha256']):
              raise SystemExit('sha256 must be 64 lowercase hex chars')
          if not r['asset_name'].endswith('.tar.gz'):
              raise SystemExit('asset_name must end with .tar.gz')
          if not str(r['pkg_url']).startswith('https://'):
              raise SystemExit('pkg_url must use https')
          canonical = f"{r['version']}\n{r['sha256']}\n{size}"
          open('/tmp/owc-release-canonical', 'w', encoding='utf-8').write(canonical)
          try:
              sig = base64.b64decode(r['signature'], validate=True)
          except Exception as exc:
              raise SystemExit('signature is not valid base64: %s' % exc)
          open('/tmp/owc-release-signature', 'wb').write(sig)

          def version_tuple(value):
              m = re.fullmatch(r'H(\d+)\.(\d+)\.(\d+)', value)
              return tuple(map(int, m.groups())) if m else None

          url = f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/releases/latest/download/backend-manifest.json"
          try:
              current = json.loads(subprocess.check_output(
                  ['curl', '-fsSL', '--max-time', '30', url], text=True))
              current_tuple = version_tuple(current['version'])
              new_tuple = version_tuple(r['version'])
              if current_tuple and new_tuple and new_tuple <= current_tuple:
                  raise SystemExit(
                      f"version {r['version']} must be greater than latest {current['version']}")
              print(f"latest={current['version']}, new={r['version']}")
          except subprocess.CalledProcessError:
              print('no existing backend-manifest.json; first release')
          PY
          printf '%s' "$OWC_MANIFEST_PUBKEY" | xxd -r -p > /tmp/owc-release-pub.der
          openssl pkey -pubin -inform DER -in /tmp/owc-release-pub.der -noout
          openssl pkeyutl -verify -pubin -inkey /tmp/owc-release-pub.der -keyform DER \
            -rawin -in /tmp/owc-release-canonical -sigfile /tmp/owc-release-signature

      - name: Download and verify package
        run: |
          set -euo pipefail
          curl -fL --retry 3 --retry-delay 2 --max-time 300 "$PKG_URL" -o "$ASSET_NAME"
          echo "$SHA256  $ASSET_NAME" | sha256sum -c -
          test "$(stat -c%s "$ASSET_NAME")" = "$SIZE"

      - name: Build signed manifest
        run: |
          python3 - <<'PY'
          import json, os
          m = {
              'version': os.environ['VERSION'],
              'url': f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/releases/download/{os.environ['TAG']}/{os.environ['ASSET_NAME']}",
              'sha256': os.environ['SHA256'],
              'size': int(os.environ['SIZE']),
              'signature': os.environ['SIGNATURE'],
              'notes': os.environ['NOTES'],
          }
          with open('backend-manifest.json', 'w', encoding='utf-8') as f:
              json.dump(m, f, ensure_ascii=False, indent=2)
              f.write('\n')
          with open('release-notes.txt', 'w', encoding='utf-8') as f:
              f.write(os.environ['NOTES'] + '\n')
          PY

      - name: Verify built manifest
        env:
          OWC_MANIFEST_PUBKEY: "302a300506032b6570032100ffef8dfc9e818fe2a0b70c18c2f3b03608707e3d50464f40a355096f142881d5"
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, json, re
          m = json.load(open('backend-manifest.json', encoding='utf-8'))
          if not m['url'].startswith('https://github.com/'):
              raise SystemExit('manifest url must point at GitHub releases')
          if not re.fullmatch(r'[0-9a-f]{64}', m['sha256']):
              raise SystemExit('manifest sha256 invalid')
          canonical = f"{m['version']}\n{m['sha256']}\n{int(m['size'])}"
          open('/tmp/owc-manifest-canonical', 'w', encoding='utf-8').write(canonical)
          open('/tmp/owc-manifest-signature', 'wb').write(base64.b64decode(m['signature'], validate=True))
          print(f"manifest {m['version']} size={m['size']}")
          PY
          printf '%s' "$OWC_MANIFEST_PUBKEY" | xxd -r -p > /tmp/owc-release-pub.der
          openssl pkeyutl -verify -pubin -inkey /tmp/owc-release-pub.der -keyform DER \
            -rawin -in /tmp/owc-manifest-canonical -sigfile /tmp/owc-manifest-signature

      - name: Create release and upload assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release $TAG already exists; refusing to overwrite" >&2
            exit 1
          fi
          gh release create "$TAG" "$ASSET_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "OWC Backend $VERSION" \
            --notes-file release-notes.txt
          gh release upload "$TAG" backend-manifest.json \
            --repo "$GITHUB_REPOSITORY" --clobber

      - name: Commit public manifest and close request
        run: |
          set -euo pipefail
          git config user.name "owc-release-bot"
          git config user.email "owc-release-bot@users.noreply.github.com"
          git add backend-manifest.json
          git rm backend-release-request.json
          git commit -m "release: backend $VERSION signed manifest [skip publish]"
          git pull --rebase origin main
          git push
